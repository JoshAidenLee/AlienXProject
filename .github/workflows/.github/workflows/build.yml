name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: |
          brew install python3
          pip3 install requests
          
      - name: Make scripts executable
        run: chmod +x *.sh *.py
        
      - name: Build IPA
        run: |
          if [ -d "AlienXProject" ]; then
            cd AlienXProject
          fi
          ./build.sh
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: AlienX-Mobile-IPA
          path: |
            *.ipa
            AlienXProject/*.ipa
